name: CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter. Gating on the base branch means a stacked pull
  # request — one opened against another feature branch — runs nothing, and
  # reports only the skipped automerge job, which reads like a pass. Push is
  # limited to the long-lived branches so feature-branch pushes do not
  # double-run.
  pull_request:
  # Called by release.yml to verify main before anything is tagged.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/secretscreen/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test with coverage
        run: pytest --cov --cov-report=xml --tb=short -q

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
