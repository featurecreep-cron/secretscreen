version: 2
updates:
  # Prefixes follow one rule: "deps:" for anything that reaches a user, which
  # cuts a patch release; "chore(...)" for anything that does not.
  #
  # secretscreen has NO runtime dependencies — the pip ecosystem here sees only
  # dev tooling (pytest, ruff, mypy). A ruff bump must not cut a release of a
  # library whose code did not change, so pip stays on "chore" and dependabot's
  # own scope distinguishes deps from deps-dev. Switch pip to "deps" the day a
  # real runtime dependency is added.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pip-patches:
        update-types: ["patch"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
